<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVP CHAMPIONS RANKINGS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17130d; --panel:#1f1c24; --slot:#26232b; --line:#40361f; --text:#f6f6f8; --sub:#a6a196;
  --accent:#f0b93d; --accent2:#ffdd66;
}
*{box-sizing:border-box}
html{background:#0a0a0c}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#241d10 0%,#171420 45%,#0a0a0c 100%);color:var(--text);font-family:'Inter',system-ui,sans-serif;padding:14px 12px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.brand{display:flex;align-items:center;gap:6px}
.brand img{width:38px;height:38px;object-fit:contain;flex-shrink:0}
h1{font-size:1.5rem;font-weight:900;letter-spacing:.3px;margin:0;line-height:1}
.accent{color:var(--accent)}
.topicons{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:32px;height:32px;border-radius:50%;background:var(--slot);border:1px solid var(--line);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg{width:16px;height:16px}
.icon-btn.active{background:var(--accent);color:#0a0a0c;border-color:var(--accent)}
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sub{color:var(--sub);font-size:.72rem}
.search{width:130px;flex-shrink:0;background:var(--slot);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:6px 10px;font-family:inherit;font-size:.68rem}
.search::placeholder{color:var(--sub)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.tab{width:46px;height:46px;flex-shrink:0;border-radius:12px;background:var(--slot);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tab img{width:76%;height:76%;object-fit:contain}
.tab.active{border-color:var(--accent);box-shadow:0 0 10px rgba(240,185,61,.55)}
.row{display:flex;align-items:stretch;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row-label{width:58px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:900;color:#0a0a0c}
.row-label img{width:20px;height:20px;object-fit:contain}
.row-label .tname{font-size:1.35rem;line-height:1}
.row-players{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel);align-content:flex-start}
.card{width:70px;text-align:center;cursor:pointer;position:relative}
.head{width:64px;height:64px;margin:0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;color:#fff;overflow:hidden;background:var(--slot);border:1px solid var(--line)}
.head img{width:100%;height:100%;object-fit:cover}
.rtag{position:absolute;top:-3px;right:3px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-size:.5rem;padding:1px 3px;color:var(--accent);font-weight:800}
.pname{font-size:.62rem;color:var(--sub);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.empty{color:var(--sub);font-size:.72rem;padding:8px 4px}
.overall-board{background:linear-gradient(160deg,#241a0c 0%,#171522 60%,#100f16 100%);border:1px solid var(--accent);border-radius:14px;padding:6px 10px;box-shadow:0 0 26px rgba(240,185,61,.18);overflow-x:auto}
.lb-head-row{display:grid;grid-template-columns:38px minmax(160px,1.5fr) 62px 54px minmax(150px,1fr);gap:10px;align-items:center;padding:6px 8px 10px;min-width:580px;font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line)}
.lb-row{display:grid;grid-template-columns:38px minmax(160px,1.5fr) 62px 54px minmax(150px,1fr);align-items:center;gap:10px;padding:13px 8px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;min-width:580px}
.lb-row:last-child{border-bottom:none}
.lb-row.rank-gold::before,.lb-row.rank-silver::before,.lb-row.rank-bronze::before{content:"";position:absolute;top:-6px;left:-46px;width:160px;height:34px;transform:rotate(-45deg)}
.lb-row.rank-gold::before{background:linear-gradient(90deg,#ffd700,#fff4c2);box-shadow:0 0 10px rgba(255,215,0,.55)}
.lb-row.rank-silver::before{background:linear-gradient(90deg,#c8ced6,#eef2f5);box-shadow:0 0 10px rgba(200,206,214,.5)}
.lb-row.rank-bronze::before{background:linear-gradient(90deg,#cd8a4d,#eab784);box-shadow:0 0 10px rgba(205,138,77,.5)}
.lb-rank{text-align:center;font-weight:900;color:#fff;font-size:1.15rem;position:relative;z-index:1}
.lb-player{display:flex;align-items:center;gap:9px;min-width:0;position:relative;z-index:1}
.lb-avatar{width:64px;height:64px;border-radius:10px;overflow:hidden;flex-shrink:0;border:2px solid var(--accent);background:var(--slot);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;color:#fff}
.lb-avatar img{width:100%;height:100%;object-fit:cover}
.lb-player-info{min-width:0}
.lb-name{font-size:.82rem;font-weight:700;color:#c9c7d1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-points{font-size:.62rem;color:var(--sub);font-weight:600;margin-top:1px}
.lb-region-col{font-size:.64rem;color:var(--sub);background:var(--slot);border:1px solid var(--line);border-radius:4px;padding:3px 6px;text-align:center;justify-self:start}
.lb-tier-col{justify-self:start;display:flex;align-items:center}
.tbadge{display:block;flex-shrink:0;overflow:visible}
.player-title{display:flex;align-items:center;gap:8px;margin-top:8px}
.player-title span{font-size:.9rem;font-weight:800;letter-spacing:.3px}

.profile-tabs{display:flex;gap:8px;margin:14px 0 12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.profile-tab{padding:6px 14px;border-radius:8px;background:var(--slot);border:1px solid var(--line);cursor:pointer;font-size:.72rem;font-weight:800;color:var(--sub);font-family:inherit}
.profile-tab.active{background:var(--accent);color:#0a0a0c;border-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.history-summary{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.hstat{display:flex;flex-direction:column;gap:2px;font-size:.64rem;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.hstat b{font-size:1rem;color:var(--text);font-weight:800}
.rival-card{background:var(--slot);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.76rem}
.rival-card b{color:var(--accent)}
.match-list{max-height:340px;overflow-y:auto}
.match-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:.76rem}
.match-row:last-child{border-bottom:none}
.match-result{font-weight:800;padding:3px 8px;border-radius:5px;font-size:.64rem;flex-shrink:0}
.match-result.win{background:#1f7a4a;color:#fff}
.match-result.loss{background:#7a2626;color:#fff}
.match-gm{width:22px;height:22px;flex-shrink:0}
.match-gm img{width:100%;height:100%;object-fit:contain}
.match-opp{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.match-kd{color:var(--sub);font-size:.68rem;flex-shrink:0}
.match-date{color:var(--sub);font-size:.62rem;flex-shrink:0;width:52px;text-align:right}
.lb-top3{display:flex;gap:6px}
.mini-gm{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--slot);flex-shrink:0}
.mini-gm img{width:60%;height:60%;object-fit:contain}
.mini-gm.mini-gm-empty{border-style:dashed;border-color:var(--sub);background:transparent}
.fab{position:fixed;bottom:18px;right:18px;background:var(--accent);color:#0a0a0c;border:none;width:50px;height:50px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 16px rgba(240,185,61,.45)}
.modal-bg{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal-bg.open{display:flex}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:340px;width:100%;max-height:85vh;overflow-y:auto}
.modal-x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--slot);border:1px solid var(--line);color:var(--sub);font-size:1rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal h2{margin:0 0 14px;font-size:1rem;font-weight:800}
.skin-lg{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--slot)}
.field{margin-bottom:8px}
.field label{display:block;font-size:.68rem;color:var(--sub);margin-bottom:3px;font-weight:600}
.field input,.field select{width:100%;background:var(--slot);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font-family:inherit;font-size:.8rem}
.gm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gm-grid label{font-size:.64rem;color:var(--sub);font-weight:600;display:block;margin-bottom:2px}
.btnrow{display:flex;gap:8px;margin-top:16px}
button.act{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:.75rem;font-family:inherit;font-weight:700}
.save{background:var(--accent);color:#0a0a0c}
.cancel{background:var(--slot);color:var(--text)}
.del{background:#3a1518;color:#ff6b6b;border:1px solid #5c2226}
.stat{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.78rem}
.stat .gm-name{display:flex;align-items:center;gap:7px}
.gm-icon-sm{width:18px;height:18px;flex-shrink:0;border-radius:50%;overflow:hidden}
.gm-icon-sm img{width:100%;height:100%;object-fit:cover}
.gm-tile-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.gm-tile{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:8px 4px;border-radius:10px;background:var(--slot);border:1px solid var(--line);width:76px;flex-shrink:0}
.gm-tile img{width:34px;height:34px;object-fit:contain}
.gm-tile .gt-tier{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:5px;color:#0a0a0c}
.badge{padding:3px 9px;border-radius:6px;color:#0a0a0c;font-weight:700;font-size:.7rem}
#statusline{font-size:.7rem}
.rtext{font-size:.72rem;color:var(--sub);line-height:1.7;margin:0 0 10px}
.rtext b{color:var(--text)}
.rtitle{font-size:.78rem;font-weight:800;color:var(--accent);margin:14px 0 6px}
.rtitle:first-child{margin-top:0}
.centerinfo{text-align:center;color:var(--sub);font-size:.7rem;margin-bottom:6px}

/* ---- Home screen ---- */
.home-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.home-icon img{width:76px;height:76px;object-fit:contain}
.home-title{font-size:1.9rem;font-weight:900;margin:4px 0 6px;letter-spacing:.3px}
.home-sub{color:var(--sub);font-size:.78rem;margin:-8px 0 6px}
.home-btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:13px 30px;border-radius:12px;background:var(--accent);color:#0a0a0c;font-weight:800;text-decoration:none;border:none;cursor:pointer;font-size:.82rem;font-family:inherit;box-shadow:0 4px 18px rgba(240,185,61,.3)}
.discord-btn{background:#5865F2;color:#fff;box-shadow:0 4px 18px rgba(88,101,242,.35)}

/* ---- Rank ring accents (top 3) ---- */
.lb-avatar.rank-gold{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.55)}
.lb-avatar.rank-silver{border-color:#d6dbe0;box-shadow:0 0 12px rgba(214,219,224,.5)}
.lb-avatar.rank-bronze{border-color:#cd8a4d;box-shadow:0 0 12px rgba(205,138,77,.5)}

/* ---- Player profile modal (MC-Tiers style) ---- */
.player-modal{max-width:600px}
.player-modal-inner{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.player-left{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:130px}
.skin-ring{width:104px;height:104px;border-radius:50%;padding:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.skin-ring.rank-gold{background:linear-gradient(145deg,#fff4c2,#d4a017)}
.skin-ring.rank-silver{background:linear-gradient(145deg,#f1f4f6,#9aa4ad)}
.skin-ring.rank-bronze{background:linear-gradient(145deg,#eab784,#8a5a2e)}
.player-name{font-size:1.05rem;font-weight:800;color:#fff;margin-top:8px;text-align:center}
.player-region{font-size:.72rem;color:var(--sub);font-weight:700;letter-spacing:.4px;margin-top:2px}
.player-rankline{font-size:.74rem;color:var(--accent);font-weight:800;margin-top:4px}
.player-right{flex:1;min-width:220px;width:100%}
.player-stats{display:flex;gap:22px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);justify-content:center}
.pstat{display:flex;flex-direction:column;gap:3px;font-size:.66rem;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.pstat b{font-size:1rem;color:var(--text);font-weight:800;text-transform:none;letter-spacing:0}
.gm-ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--slot)}
.gm-ring img{width:64%;height:64%;object-fit:contain}
.gm-tile .gt-tier{margin-top:-7px;position:relative;z-index:1;border:2px solid var(--panel)}
.player-modal-inner{justify-content:center}
.player-right{text-align:center}
.gm-tile-grid{justify-content:center}
@media(min-width:560px){
  .player-modal{max-width:680px}
  .player-modal-inner{flex-wrap:nowrap;justify-content:flex-start}
  .player-right{text-align:left}
  .player-stats{justify-content:flex-start}
  .gm-tile-grid{justify-content:flex-start}
}

/* ---- Skin file upload preview ---- */
.skin-preview{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block;background:var(--slot)}
</style></head>
<body>

<div id="homeScreen" class="home-screen">
  <div class="home-icon" id="homeIconWrap"></div>
  <h1 class="home-title">PVP <span class="accent">CHAMPIONS</span></h1>
  <div class="home-sub">Rankings &amp; Tierlist</div>
  <div class="home-btnrow">
    <button class="home-btn" id="enterBtn">View Tierlist</button>
    <a class="home-btn discord-btn" href="https://discord.gg/gH4JZ4x3u" target="_blank" rel="noopener">Join Discord</a>
  </div>
</div>

<div id="appScreen" style="display:none">
<div class="topbar">
  <div class="brand" id="trophyBrand"></div>
  <div class="topicons">
    <button class="icon-btn" id="infoBtn" title="Points info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12.01" y2="8"/><line x1="12" y1="11" x2="12" y2="16"/></svg>
    </button>
    <button class="icon-btn" id="rulesBtn" title="Rules">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9a2 2 0 0 1 2 2v13l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2z"/></svg>
    </button>
    <button class="icon-btn" id="homeBtn" title="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    </button>
    <button class="icon-btn" id="lockBtn" title="Admin"></button>
  </div>
</div>
<div class="statusrow">
  <div class="sub" id="statusline">Connecting...</div>
  <input class="search" id="searchInput" placeholder="Search...">
</div>
<div class="tabs" id="tabs"></div>
<div id="board"></div>
<button class="fab" id="addBtn" style="display:none" title="Add player">+</button>
</div>

<div class="modal-bg" id="infoBg">
  <div class="modal">
    <button class="modal-x" id="closeInfo">&times;</button>
    <h2>Points Needed Per Tier</h2>
    <div id="infoStats"></div>
  </div>
</div>

<div class="modal-bg" id="rulesBg">
  <div class="modal">
    <button class="modal-x" id="closeRules">&times;</button>
    <h2>Ranking System</h2>
    <div id="rulesBody"></div>
  </div>
</div>

<div class="modal-bg" id="addBg">
  <div class="modal">
    <button class="modal-x" id="cancelBtn">&times;</button>
    <h2 id="modalTitle">ADD PLAYER</h2>
    <div class="field"><label>IGN</label><input id="f-name" placeholder="Player name"></div>
    <div class="field"><label>Region</label><select id="f-region"></select></div>
    <div class="field"><label>Skin Image (auto-resized to 64&times;64 PNG)</label><input type="file" id="f-skin-file" accept="image/*"><img id="f-skin-preview" class="skin-preview" style="display:none"></div>
    <div class="field"><label style="margin-bottom:6px">Gamemode Points</label>
      <div class="gm-grid" id="gm-inputs"></div>
    </div>
    <div class="btnrow">
      <button class="act save" id="saveBtn">Save</button>
    </div>
    <div class="btnrow" id="delRow" style="display:none">
      <button class="act del" id="delBtn">Delete Player</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="viewBg">
  <div class="modal player-modal">
    <button class="modal-x" id="closeView">&times;</button>
    <div class="player-modal-inner">
      <div class="player-left">
        <div class="skin-ring" id="skinRing"><img class="skin-lg" id="viewSkin" style="display:none"></div>
        <div class="player-name" id="viewName"></div>
        <div class="player-region" id="viewRegion"></div>
        <div class="player-rankline" id="viewRank"></div>
        <div class="player-title" id="viewTitle"></div>
      </div>
      <div class="player-right">
        <div class="player-stats">
          <div class="pstat"><span>Total Points</span><b id="viewPoints"></b></div>
        </div>
        <div class="profile-tabs">
          <button class="profile-tab active" id="tabOverview">Overview</button>
          <button class="profile-tab" id="tabHistory">Match History</button>
        </div>
        <div class="tab-panel active" id="panelOverview">
          <div class="gm-tile-grid" id="viewStats"></div>
        </div>
        <div class="tab-panel" id="panelHistory">
          <div id="historyBody"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="btnrow" id="editRow" style="display:none">
      <button class="act save" id="editBtn">Edit Player</button>
      <button class="act" id="logMatchBtn" style="background:var(--slot);border:1px solid var(--line);color:var(--text)">Log Match</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="matchBg">
  <div class="modal">
    <button class="modal-x" id="closeMatch">&times;</button>
    <h2>LOG MATCH</h2>
    <div class="field"><label>Player</label><input id="match-you" disabled></div>
    <div class="field"><label>Opponent</label><select id="match-opponent"></select></div>
    <div class="field"><label>Gamemode</label><select id="match-gamemode"></select></div>
    <div class="field"><label>Winner</label><select id="match-winner">
      <option value="a">This player won</option>
      <option value="b">Opponent won</option>
    </select></div>
    <div class="field"><label>Date</label><input type="date" id="match-date"></div>
    <div class="gm-grid">
      <div><label>Their Kills</label><input type="number" id="match-kills" value="0"></div>
      <div><label>Their Deaths</label><input type="number" id="match-deaths" value="0"></div>
      <div><label>Opp Kills</label><input type="number" id="match-opp-kills" value="0"></div>
      <div><label>Opp Deaths</label><input type="number" id="match-opp-deaths" value="0"></div>
    </div>
    <div class="btnrow"><button class="act save" id="saveMatchBtn">Save Match</button></div>
  </div>
</div>

<div class="modal-bg" id="ptsInfoBg">
  <div class="modal">
    <button class="modal-x" id="closePtsInfo">&times;</button>
    <h2 id="ptsInfoTitle"></h2>
    <div id="ptsInfoBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====== FILL THESE IN FROM YOUR FIREBASE PROJECT ======

function regPoly(n, r, start){
  const pts = [];
  for(let i=0;i<n;i++){
    const a = (start + i*360/n) * Math.PI/180;
    pts.push([32 + r*Math.cos(a), 32 + r*Math.sin(a)]);
  }
  return pts;
}
function starPts(n, rOut, rIn){
  const pts = [];
  for(let i=0;i<n*2;i++){
    const a = (-90 + i*180/n) * Math.PI/180;
    const r = i%2===0 ? rOut : rIn;
    pts.push([32 + r*Math.cos(a), 32 + r*Math.sin(a)]);
  }
  return pts;
}
const scalePts = (pts,k)=> pts.map(([x,y])=>[32+(x-32)*k, 32+(y-32)*k]);
const ptsStr = pts => pts.map(([x,y])=>x.toFixed(1)+","+y.toFixed(1)).join(" ");

let _tbId = 0;
function titleBadge(letter, size){
  size = size || 40;
  const t = TITLE[letter] || TITLE.F;
  const s = SHAPES[TITLE[letter] ? letter : "F"];
  const id = "tb" + (_tbId++);
  const inner = scalePts(s.gem, 0.6);
  let back = "";
  if(s.back){
    back = `<polygon points="${ptsStr(scalePts(s.gem, s.back))}" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)" stroke-width="1.2" stroke-linejoin="round"/>`;
  } else {
    back = `<circle cx="32" cy="32" r="30" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.2)" stroke-width="1.2"/>`;
  }
  let acc = "";
  if(s.accent==="spark"){
    const sp = (cx,cy)=>`<polygon points="${ptsStr(starPts(4,4.2,1.2).map(([x,y])=>[x-32+cx,y-32+cy]))}" fill="#fff" opacity=".9"/>`;
    acc = sp(6,32) + sp(58,32);
  } else if(s.accent==="ticks"){
    acc = `<path d="M6 26v12M58 26v12" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/>`;
  }
  const glow = s.glow ? `filter:drop-shadow(0 0 ${s.glow}px ${t.c});` : "";
  return `<svg class="tbadge" width="${size}" height="${size}" viewBox="0 0 64 64" style="${glow}" aria-label="${letter} title">`
    + `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.l}"/><stop offset="1" stop-color="${t.d}"/></linearGradient></defs>`
    + back + acc
    + `<polygon points="${ptsStr(s.gem)}" fill="url(#${id})" stroke="${t.l}" stroke-width="1.4" stroke-linejoin="round"/>`
    + `<polygon points="${ptsStr(inner)}" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.4)" stroke-width="1" stroke-linejoin="round"/>`
    + `<text x="32" y="${s.ty}" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="900" fill="#fff" stroke="rgba(0,0,0,.6)" stroke-width="2.6" paint-order="stroke" stroke-linejoin="round">${letter}</text>`
    + `</svg>`;
}


function pointsToTier(pts){
  pts = pts||0;
  if(pts>=750) return "S";
  if(pts>=550) return "High A";
  if(pts>=400) return "Low A";
  if(pts>=300) return "High B";
  if(pts>=200) return "Low B";
  if(pts>=120) return "High C";
  if(pts>=85) return "Low C";
  if(pts>=50) return "High D";
  if(pts>=30) return "Low D";
  return "F";
}

function isRanked(p, key){
  return !!(p.points && Object.prototype.hasOwnProperty.call(p.points, key));
}
function totalPoints(p){
  if(!p.points) return 0;
  return GAMEMODES.reduce((sum,[key])=> sum + (isRanked(p,key) ? (p.points[key]||0) : 0), 0);
}
// ---- Overall tier: built from the player's tiers in their tested gamemodes ----
const TIER_LEVEL = {"S":9,"High A":8,"Low A":7,"High B":6,"Low B":5,"High C":4,"Low C":3,"High D":2,"Low D":1,"F":0};
// Importance of each gamemode for overall skill in SMP PvP (edit these numbers to rebalance)
const GM_WEIGHT = {diamondsmp:10, smp:9, uhc:8, sword:7, axe:6, spearmace:4, mace:4, pot:4, netherop:4, tntcart:2, crystal:1};
function overallTierFor(p){
  const tested = GAMEMODES.filter(([k])=>isRanked(p,k)).map(([k])=>({
    w: GM_WEIGHT[k] || 1,
    lvl: TIER_LEVEL[pointsToTier(p.points[k])]
  }));
  if(!tested.length) return "F";
  const wAvg = arr => arr.reduce((s,t)=>s+t.w*t.lvl,0) / arr.reduce((s,t)=>s+t.w,0);
  const best3 = tested.slice().sort((a,b)=> b.lvl-a.lvl || b.w-a.w).slice(0,3);
  const blend = 0.7*wAvg(tested) + 0.3*wAvg(best3);
  // Only testing minor gamemodes limits how high the overall tier can go
  const coverage = Math.min(1, tested.reduce((s,t)=>s+t.w,0) / 20);
  const lvl = Math.round(blend * (0.2 + 0.8*coverage));
  if(lvl>=9) return "S";
  if(lvl>=7) return "A";
  if(lvl>=5) return "B";
  if(lvl>=3) return "C";
  if(lvl>=2) return "D";
  if(lvl>=1) return "E";
  return "F";
}
function topGamemodes(p, n){
  if(!p.points) return [];
  const entries = GAMEMODES
    .filter(([key])=> isRanked(p,key))
    .map(([key,label])=>[key,label,p.points[key]||0]);
  entries.sort((a,b)=> b[2]-a[2]);
  return entries.slice(0, n);
}

function gmIcon(key){
  return `<img src="${IMG_DATA[key]}" alt="${key}">`;
}

let currentGM = "overall";
let players = [];
let currentViewPlayer = null;
const historyCache = new Map();
let editingId = null;
let searchQuery = "";
let isAdmin = sessionStorage.getItem("pvpAdmin") === "1";

const LOCK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="9" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
const UNLOCK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="9" rx="2"/><path d="M8 10V7a4 4 0 0 1 7-2.6"/></svg>`;

document.getElementById("trophyBrand").innerHTML = `<h1>PVP</h1>${gmIcon("overall")}<h1>CHAMPIONS</h1>`;
document.getElementById("homeIconWrap").innerHTML = gmIcon("overall");

document.getElementById("enterBtn").onclick = ()=>{
  document.getElementById("homeScreen").style.display = "none";
  document.getElementById("appScreen").style.display = "block";
};
document.getElementById("homeBtn").onclick = ()=>{
  document.getElementById("appScreen").style.display = "none";
  document.getElementById("homeScreen").style.display = "flex";
};

function updateAdminUI(){
  document.getElementById("addBtn").style.display = isAdmin ? "flex" : "none";
  const lb = document.getElementById("lockBtn");
  lb.classList.toggle("active", isAdmin);
  lb.innerHTML = isAdmin ? UNLOCK_ICON : LOCK_ICON;
}
updateAdminUI();

document.getElementById("lockBtn").onclick = ()=>{
  if(isAdmin){
    if(confirm("Lock admin mode?")){
      isAdmin = false; sessionStorage.removeItem("pvpAdmin"); updateAdminUI();
    }
    return;
  }
  const pass = prompt("Enter admin passcode:");
  if(pass === null) return;
  if(pass === ADMIN_PASSCODE){
    isAdmin = true; sessionStorage.setItem("pvpAdmin","1"); updateAdminUI();
  } else {
    alert("Incorrect passcode.");
  }
};

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = "";
  const ov = document.createElement("div");
  ov.className = "tab" + (currentGM==="overall" ? " active" : "");
  ov.title = "Overall";
  ov.innerHTML = gmIcon("overall");
  ov.onclick = ()=>{ currentGM = "overall"; render(); };
  t.appendChild(ov);
  GAMEMODES.forEach(([key,label])=>{
    const b = document.createElement("div");
    b.className = "tab" + (key===currentGM ? " active" : "");
    b.title = label;
    b.innerHTML = gmIcon(key);
    b.onclick = ()=>{ currentGM = key; render(); };
    t.appendChild(b);
  });
}

function playerHead(p){
  if(p.skin){
    return `<img src="${p.skin}" alt="${p.name}">`;
  }
  const initial = (p.name||"?").charAt(0).toUpperCase();
  return initial;
}

function renderOverallLeaderboard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "overall-board";

  const filtered = players.filter(p => p.name && p.name.toLowerCase().includes(searchQuery));
  filtered.sort((a,b)=>{
    const pb = totalPoints(b), pa = totalPoints(a);
    if(pb !== pa) return pb - pa;
    return (a.name||"").localeCompare(b.name||"");
  });

  const head = document.createElement("div");
  head.className = "lb-head-row";
  head.innerHTML = `<span></span><span>Player</span><span>Region</span><span>Title</span><span>Rank</span>`;
  wrap.appendChild(head);

  if(filtered.length===0){
    wrap.innerHTML += `<div class="empty">${searchQuery ? "no match" : "no players ranked yet"}</div>`;
  } else {
    filtered.forEach((p,i)=>{
      const ot = overallTierFor(p);
      const rankClass = i===0 ? " rank-gold" : i===1 ? " rank-silver" : i===2 ? " rank-bronze" : "";
      const top3 = topGamemodes(p, 3);
      let top3Html = top3.map(([key,label,pts])=>{
        const tier = pointsToTier(pts);
        return `<div class="mini-gm" style="border-color:${TIER_COLOR[tier]}" title="${label}: ${TIER_SHORT[tier]}"><img src="${IMG_DATA[key]}" alt="${label}"></div>`;
      }).join("");
      for(let k=top3.length;k<3;k++){
        top3Html += `<div class="mini-gm mini-gm-empty" title="No ranking"></div>`;
      }
      const row = document.createElement("div");
      row.className = "lb-row" + rankClass;
      row.innerHTML = `
        <div class="lb-rank">${i+1}</div>
        <div class="lb-player">
          <div class="lb-avatar">${playerHead(p)}</div>
          <div class="lb-player-info">
            <div class="lb-name">${p.name}</div>
            <div class="lb-points">${totalPoints(p)} pts</div>
          </div>
        </div>
        <div class="lb-region-col">${p.region||"—"}</div>
        <div class="lb-tier-col">${titleBadge(ot,42)}</div>
        <div class="lb-top3">${top3Html}</div>
      `;
      row.onclick = ()=> openView(p);
      wrap.appendChild(row);
    });
  }
  board.appendChild(wrap);
}

function renderGamemodeBoard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const wrap = document.createElement("div");

  TIERS.forEach(tier=>{
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("div");
    label.className = "row-label";
    label.style.background = TIER_COLOR[tier];
    label.innerHTML = `${gmIcon(currentGM)}<span class="tname">${TIER_SHORT[tier]}</span>`;
    const pr = document.createElement("div");
    pr.className = "row-players";

    const inTier = players.filter(p=>{
      if(!p.name || !p.name.toLowerCase().includes(searchQuery)) return false;
      if(!isRanked(p, currentGM)) return false;
      const pts = p.points[currentGM] || 0;
      return pointsToTier(pts) === tier;
    });

    if(inTier.length===0){
      const e = document.createElement("div"); e.className="empty"; e.textContent = searchQuery ? "no match" : "—"; pr.appendChild(e);
    }
    inTier.forEach(p=>{
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div class="head">${playerHead(p)}</div><div class="rtag">${p.region||""}</div><div class="pname">${p.name}</div>`;
      c.onclick = ()=> openView(p);
      pr.appendChild(c);
    });

    row.appendChild(label); row.appendChild(pr);
    wrap.appendChild(row);
  });
  board.appendChild(wrap);
}

function render(){
  renderTabs();
  if(currentGM === "overall"){ renderOverallLeaderboard(); }
  else { renderGamemodeBoard(); }
}

function populateSelect(id, list){
  const sel = document.getElementById(id);
  sel.innerHTML = list.map(v=>`<option value="${v}">${v}</option>`).join("");
}
document.getElementById("f-region").innerHTML = REGIONS.map(([code,name])=>`<option value="${code}">${code} — ${name}</option>`).join("");

const gmInputsDiv = document.getElementById("gm-inputs");
gmInputsDiv.innerHTML = GAMEMODES.map(([key,label])=>`<div><label>${label}</label><input type="number" id="pts-${key}" placeholder="Unranked"></div>`).join("");

let currentSkinData = "";

function setSkinPreview(dataUrl){
  currentSkinData = dataUrl || "";
  const prev = document.getElementById("f-skin-preview");
  if(currentSkinData){ prev.src = currentSkinData; prev.style.display = "block"; }
  else { prev.src = ""; prev.style.display = "none"; }
}

document.getElementById("f-skin-file").onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement("canvas");
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.clearRect(0,0,64,64);
      ctx.drawImage(img,0,0,64,64);
      setSkinPreview(canvas.toDataURL("image/png"));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

function openAdd(){
  editingId = null;
  document.getElementById("modalTitle").textContent = "ADD PLAYER";
  document.getElementById("f-name").value = "";
  document.getElementById("f-region").value = "NA";
  document.getElementById("f-skin-file").value = "";
  setSkinPreview("");
  GAMEMODES.forEach(([key])=>{ document.getElementById(`pts-${key}`).value = ""; });
  document.getElementById("delRow").style.display = "none";
  document.getElementById("addBg").classList.add("open");
}
function openEdit(p){
  editingId = p.id;
  document.getElementById("modalTitle").textContent = "EDIT PLAYER";
  document.getElementById("f-name").value = p.name||"";
  document.getElementById("f-region").value = p.region||"NA";
  document.getElementById("f-skin-file").value = "";
  setSkinPreview(p.skin||"");
  GAMEMODES.forEach(([key])=>{ document.getElementById(`pts-${key}`).value = isRanked(p,key) ? p.points[key] : ""; });
  document.getElementById("delRow").style.display = "flex";
  document.getElementById("viewBg").classList.remove("open");
  document.getElementById("addBg").classList.add("open");
}
function computeOverallRank(target){
  const sorted = players.slice().sort((a,b)=>{
    const pb = totalPoints(b), pa = totalPoints(a);
    if(pb !== pa) return pb - pa;
    return (a.name||"").localeCompare(b.name||"");
  });
  return sorted.findIndex(p=>p.id===target.id) + 1;
}

async function fetchPlayerMatches(playerId){
  if(historyCache.has(playerId)) return historyCache.get(playerId);
  const [snapA, snapB] = await Promise.all([
    getDocs(query(matchesCol, where("a.playerId","==",playerId))),
    getDocs(query(matchesCol, where("b.playerId","==",playerId)))
  ]);
  const seen = new Set();
  const matches = [...snapA.docs, ...snapB.docs]
    .map(d=>({id:d.id, ...d.data()}))
    .filter(m=> seen.has(m.id) ? false : (seen.add(m.id), true))
    .sort((x,y)=> (y.createdAt||0) - (x.createdAt||0));
  historyCache.set(playerId, matches);
  return matches;
}

function renderHistory(p, matches){
  const body = document.getElementById("historyBody");
  if(!matches.length){
    body.innerHTML = `<div class="empty">No matches logged yet.</div>`;
    return;
  }
  let wins=0, losses=0, kills=0, deaths=0;
  const rivals = {};
  const rows = matches.map(m=>{
    const isA = m.a && m.a.playerId === p.id;
    const me = (isA ? m.a : m.b) || {};
    const opp = (isA ? m.b : m.a) || {};
    const won = m.winner === (isA ? "a" : "b");
    if(won) wins++; else losses++;
    kills += me.kills || 0;
    deaths += me.deaths || 0;
    const oppName = opp.ign || "Unknown";
    rivals[oppName] = (rivals[oppName]||0) + 1;
    const label = (GAMEMODES.find(g=>g[0]===m.gamemode) || ["", m.gamemode])[1];
    const icon = IMG_DATA[m.gamemode] ? `<img src="${IMG_DATA[m.gamemode]}" alt="${label}">` : "";
    const dateStr = m.createdAt ? new Date(m.createdAt).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
    return `<div class="match-row">
      <span class="match-result ${won?"win":"loss"}">${won?"WIN":"LOSS"}</span>
      <div class="match-gm" title="${label}">${icon}</div>
      <span class="match-opp">${oppName}</span>
      <span class="match-kd">${me.kills||0}/${me.deaths||0}</span>
      <span class="match-date">${dateStr}</span>
    </div>`;
  }).join("");
  const kd = deaths>0 ? (kills/deaths).toFixed(2) : kills.toFixed(2);
  let topRival = null, topCount = 0;
  Object.entries(rivals).forEach(([name,count])=>{ if(count>topCount){ topCount=count; topRival=name; } });
  body.innerHTML = `
    <div class="history-summary">
      <div class="hstat"><span>Wins</span><b>${wins}</b></div>
      <div class="hstat"><span>Losses</span><b>${losses}</b></div>
      <div class="hstat"><span>K/D</span><b>${kd}</b></div>
      <div class="hstat"><span>Kills</span><b>${kills}</b></div>
      <div class="hstat"><span>Deaths</span><b>${deaths}</b></div>
    </div>
    ${topRival ? `<div class="rival-card">Most played rival: <b>${topRival}</b> — ${topCount} match${topCount===1?"":"es"}</div>` : ""}
    <div class="match-list">${rows}</div>
  `;
}

async function loadHistory(p){
  const body = document.getElementById("historyBody");
  body.innerHTML = `<div class="empty">Loading…</div>`;
  try{
    renderHistory(p, await fetchPlayerMatches(p.id));
  }catch(e){
    body.innerHTML = `<div class="empty">Couldn't load match history.</div>`;
  }
}

function showTab(tab){
  const isOverview = tab === "overview";
  document.getElementById("tabOverview").classList.toggle("active", isOverview);
  document.getElementById("tabHistory").classList.toggle("active", !isOverview);
  document.getElementById("panelOverview").classList.toggle("active", isOverview);
  document.getElementById("panelHistory").classList.toggle("active", !isOverview);
  if(!isOverview && currentViewPlayer) loadHistory(currentViewPlayer);
}
document.getElementById("tabOverview").onclick = ()=> showTab("overview");
document.getElementById("tabHistory").onclick = ()=> showTab("history");

function openLogMatch(p){
  document.getElementById("match-you").value = p.name;
  document.getElementById("match-opponent").innerHTML = players
    .filter(x=>x.id!==p.id).sort((a,b)=>(a.name||"").localeCompare(b.name||""))
    .map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
  document.getElementById("match-gamemode").innerHTML = GAMEMODES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  document.getElementById("match-winner").value = "a";
  document.getElementById("match-date").value = new Date().toISOString().slice(0,10);
  ["match-kills","match-deaths","match-opp-kills","match-opp-deaths"].forEach(id=> document.getElementById(id).value = 0);
  document.getElementById("matchBg").dataset.playerId = p.id;
  document.getElementById("matchBg").classList.add("open");
}
document.getElementById("closeMatch").onclick = ()=> document.getElementById("matchBg").classList.remove("open");

document.getElementById("saveMatchBtn").onclick = async ()=>{
  const me = players.find(x=>x.id === document.getElementById("matchBg").dataset.playerId);
  const opp = players.find(x=>x.id === document.getElementById("match-opponent").value);
  if(!me || !opp){ alert("Pick a valid opponent."); return; }
  const data = {
    gamemode: document.getElementById("match-gamemode").value,
    a: { playerId: me.id, ign: me.name,
         kills: Number(document.getElementById("match-kills").value)||0,
         deaths: Number(document.getElementById("match-deaths").value)||0 },
    b: { playerId: opp.id, ign: opp.name,
         kills: Number(document.getElementById("match-opp-kills").value)||0,
         deaths: Number(document.getElementById("match-opp-deaths").value)||0 },
    winner: document.getElementById("match-winner").value,
    status: "confirmed", source: "manual", confirmedBy: "site-admin",
    createdAt: (()=>{
      const raw = document.getElementById("match-date").value;
      if(!raw) return Date.now();
      const t = new Date(raw + "T12:00:00").getTime();
      return isNaN(t) ? Date.now() : t;
    })()
  };
  const btn = document.getElementById("saveMatchBtn");
  btn.disabled = true;
  try{
    await addDoc(matchesCol, data);
    historyCache.delete(me.id);
    historyCache.delete(opp.id);
    document.getElementById("matchBg").classList.remove("open");
    if(currentViewPlayer && currentViewPlayer.id===me.id && document.getElementById("panelHistory").classList.contains("active")){
      loadHistory(currentViewPlayer);
    }
  }catch(e){ alert("Couldn't save match: " + e.message); }
  finally{ btn.disabled = false; }
};

function openView(p){
  currentViewPlayer = p;
  showTab("overview");
  const rank = computeOverallRank(p);
  const skinEl = document.getElementById("viewSkin");
  if(p.skin){ skinEl.src = p.skin; skinEl.style.display = "block"; } else { skinEl.style.display = "none"; }
  const ring = document.getElementById("skinRing");
  ring.className = "skin-ring" + (rank===1?" rank-gold":rank===2?" rank-silver":rank===3?" rank-bronze":"");
  document.getElementById("viewName").textContent = p.name;
  const regionName = (REGIONS.find(r=>r[0]===(p.region||""))||["",""])[1];
  document.getElementById("viewRegion").textContent = p.region ? `${p.region} — ${regionName}` : "Region not set";
  document.getElementById("viewRank").textContent = `#${rank} Overall`;
  const ot = overallTierFor(p);
  document.getElementById("viewTitle").innerHTML = `${titleBadge(ot,64)}<span style="color:${TITLE[ot].l}">${ot} Tier</span>`;
  document.getElementById("viewPoints").textContent = totalPoints(p);
  const stats = document.getElementById("viewStats");
  const sortedGM = GAMEMODES.slice().sort((a,b)=>{
    const ra = isRanked(p,a[0]), rb = isRanked(p,b[0]);
    if(ra !== rb) return ra ? -1 : 1;
    const pa = ra ? p.points[a[0]] : 0, pb = rb ? p.points[b[0]] : 0;
    return pb - pa;
  });
  stats.innerHTML = sortedGM.map(([key,label])=>{
    const ranked = isRanked(p,key);
    const pts = ranked ? p.points[key] : 0;
    const tier = ranked ? pointsToTier(pts) : null;
    const ringColor = ranked ? TIER_COLOR[tier] : "var(--line)";
    const tagBg = ranked ? TIER_COLOR[tier] : "var(--slot)";
    const tagText = ranked ? TIER_SHORT[tier] : "Unranked";
    return `<div class="gm-tile" data-key="${key}" data-label="${label}" data-pts="${pts}" data-tier="${tier||''}" data-ranked="${ranked}">
      <div class="gm-ring" style="border-color:${ringColor}"><img src="${IMG_DATA[key]}" alt="${label}"></div>
      <span class="gt-tier" style="background:${tagBg};${ranked?'':'color:var(--sub);border:1px dashed var(--line)'}">${tagText}</span>
    </div>`;
  }).join("");
  stats.querySelectorAll(".gm-tile").forEach(el=>{
    el.onclick = ()=>{
      const label = el.dataset.label, pts = el.dataset.pts, tier = el.dataset.tier, ranked = el.dataset.ranked === "true";
      document.getElementById("ptsInfoTitle").textContent = label;
      document.getElementById("ptsInfoBody").innerHTML = ranked
        ? `<div class="stat"><span>Tier</span><span class="badge" style="background:${TIER_COLOR[tier]}">${tier}</span></div>
           <div class="stat"><span>Points</span><span class="badge" style="background:var(--accent)">${pts}</span></div>`
        : `<div class="stat"><span>Status</span><span class="badge" style="background:var(--slot);color:var(--sub)">Unranked</span></div>`;
      document.getElementById("ptsInfoBg").classList.add("open");
    };
  });
  document.getElementById("editRow").style.display = isAdmin ? "flex" : "none";
  document.getElementById("editBtn").onclick = ()=> openEdit(p);
  document.getElementById("logMatchBtn").onclick = ()=> openLogMatch(p);
  document.getElementById("viewBg").classList.add("open");
}

document.getElementById("addBtn").onclick = openAdd;
document.getElementById("cancelBtn").onclick = ()=> document.getElementById("addBg").classList.remove("open");
document.getElementById("closeView").onclick = ()=> document.getElementById("viewBg").classList.remove("open");
document.getElementById("closePtsInfo").onclick = ()=> document.getElementById("ptsInfoBg").classList.remove("open");

document.getElementById("saveBtn").onclick = async ()=>{
  const name = document.getElementById("f-name").value.trim();
  if(!name){ alert("Enter a player name."); return; }
  const points = {};
  GAMEMODES.forEach(([key])=>{
    const raw = document.getElementById(`pts-${key}`).value.trim();
    if(raw !== "") points[key] = Number(raw) || 0;
  });
  const data = {
    name,
    region: document.getElementById("f-region").value,
    skin: currentSkinData,
    points
  };
  const saveBtnEl = document.getElementById("saveBtn");
  saveBtnEl.disabled = true;
  try{
    if(editingId){ await updateDoc(doc(db,"players",editingId), data); }
    else { await addDoc(playersCol, data); }
  }catch(e){
    alert("Save failed: " + e.message);
  }finally{
    saveBtnEl.disabled = false;
    document.getElementById("addBg").classList.remove("open");
  }
};

document.getElementById("delBtn").onclick = async ()=>{
  if(!editingId) return;
  if(!confirm("Delete this player?")) return;
  try{ await deleteDoc(doc(db,"players",editingId)); document.getElementById("addBg").classList.remove("open"); }
  catch(e){ alert("Delete failed: " + e.message); }
};

document.getElementById("infoStats").innerHTML = TIERS.map(t=>
  `<div class="stat"><span>${t}</span><span class="badge" style="background:${TIER_COLOR[t]}">${POINTS[t]} pts</span></div>`
).join("");
document.getElementById("infoBtn").onclick = ()=> document.getElementById("infoBg").classList.add("open");
document.getElementById("closeInfo").onclick = ()=> document.getElementById("infoBg").classList.remove("open");

document.getElementById("closeRules").onclick = ()=> document.getElementById("rulesBg").classList.remove("open");

const statusline = document.getElementById("statusline");

  onSnapshot(playersCol, (snap)=>{
    players = snap.docs.map(d=>({ id:d.id, ...d.data() }));
    statusline.textContent = `${players.length} player${players.length===1?"":"s"} ranked`;
    render();
  }, (err)=>{

    console.error(err);
  });
}catch(e){

  console.error(e);

render();
</script>
